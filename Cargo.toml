[package]
name = "rust-python-lab"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_python_lab"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
futures-channel = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }

[profile.release]
lto = "thin"
